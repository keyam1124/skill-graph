<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillGraph Cartographer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-strong: #edf2f7;
      --text: #111827;
      --muted: #526173;
      --faint: #7a8796;
      --border: #dbe3ec;
      --blue: #2368d8;
      --blue-soft: #edf5ff;
      --green: #1f9d57;
      --green-soft: #edf9f1;
      --violet: #7b4ce2;
      --violet-soft: #f3edff;
      --red: #d92d3a;
      --red-soft: #fff0f1;
      --orange: #d86518;
      --orange-soft: #fff3e8;
      --shadow: 0 12px 30px rgba(15, 23, 42, .08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 78px;
      display: grid;
      grid-template-columns: minmax(270px, 420px) minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: var(--blue);
    }

    .brand-mark::before {
      width: 8px;
      height: 8px;
      box-shadow: 20px -16px 0 var(--green);
      left: 13px;
      top: 25px;
    }

    .brand-mark::after {
      width: 28px;
      height: 3px;
      left: 12px;
      top: 22px;
      background: linear-gradient(110deg, var(--blue), var(--green));
      transform: rotate(-39deg);
      transform-origin: left center;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 13px;
      background: var(--surface);
    }

    .search-box:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 104, 216, .14);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      border: 2px solid var(--muted);
      border-radius: 999px;
      position: relative;
      flex: 0 0 auto;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      right: -7px;
      bottom: -4px;
      border-radius: 999px;
      background: var(--muted);
      transform: rotate(45deg);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      white-space: nowrap;
    }

    .stat {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 13px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
    }

    .stat strong {
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .issue-button {
      color: var(--red);
      border-color: #f4b7bd;
      background: var(--red-soft);
    }

    .issue-button:hover,
    .issue-button.active {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(217, 45, 58, .12);
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 390px);
    }

    .map-area {
      min-width: 0;
      min-height: 0;
      padding: 20px 24px 28px;
    }

    .detail-panel {
      min-width: 0;
      border-left: 1px solid var(--border);
      background: rgba(255, 255, 255, .84);
    }

    .detail-scroll {
      height: calc(100vh - 79px);
      overflow: auto;
      padding: 20px;
    }

    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sub-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
    }

    .tiny {
      color: var(--faint);
      font-size: 12px;
    }

    .map-panel {
      height: calc(100vh - 126px);
      min-height: 480px;
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .panel-head {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .panel-head h2 {
      flex: 1 0 190px;
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .line-sample {
      width: 26px;
      height: 0;
      border-top: 2px solid var(--blue);
    }

    .line-sample.ai {
      border-top-color: var(--violet);
      border-top-style: dashed;
    }

    .cluster-sample {
      width: 22px;
      height: 14px;
      border: 1px dashed #9bb8d6;
      border-radius: 4px;
      background: var(--blue-soft);
    }

    .warning-sample {
      width: 18px;
      height: 18px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: var(--red);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .map-stage {
      min-height: 0;
      position: relative;
      background:
        linear-gradient(var(--surface-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--surface-strong) 1px, transparent 1px),
        var(--surface-soft);
      background-size: 30px 30px;
    }

    #skillMap {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .map-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
    }

    .map-empty[hidden] {
      display: none;
    }

    .relation-path {
      fill: none;
      stroke: var(--blue);
      stroke-width: 1.6;
      opacity: .74;
      cursor: pointer;
    }

    .relation-path.ai {
      stroke: var(--violet);
      stroke-dasharray: 7 5;
    }

    .relation-path.dim {
      opacity: .16;
    }

    .relation-path.focused {
      stroke-width: 2.4;
      opacity: .92;
    }

    .relation-path.selected {
      stroke: var(--red);
      stroke-width: 2.8;
      opacity: 1;
    }

    .relation-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      cursor: pointer;
      pointer-events: stroke;
    }

    .cluster-region {
      pointer-events: none;
    }

    .cluster-region rect {
      fill: rgba(237, 245, 255, .58);
      stroke: #c4d6eb;
      stroke-width: 1.2;
      stroke-dasharray: 7 6;
    }

    .cluster-region text {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .cluster-region .cluster-count {
      fill: var(--faint);
      font-size: 11px;
      font-weight: 800;
    }

    .skill-node {
      cursor: pointer;
    }

    .skill-node rect {
      fill: white;
      stroke: #8bb8ff;
      stroke-width: 1.4;
      filter: drop-shadow(0 1px 0 rgba(15, 23, 42, .06));
    }

    .skill-node.ai rect {
      stroke: #b99dff;
    }

    .skill-node.dim {
      opacity: .28;
    }

    .skill-node.search rect,
    .skill-node.issue rect,
    .skill-node.related rect {
      stroke-width: 2.2;
    }

    .skill-node.search rect {
      fill: var(--green-soft);
      stroke: var(--green);
    }

    .skill-node.issue rect {
      fill: var(--red-soft);
      stroke: var(--red);
    }

    .skill-node.related rect {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .skill-node.selected rect {
      fill: var(--blue-soft);
      stroke: var(--blue);
      stroke-width: 2.8;
    }

    .skill-node text {
      fill: var(--text);
      font-size: 12px;
      font-weight: 800;
      pointer-events: none;
    }

    .warning-mark circle {
      fill: var(--red);
      stroke: white;
      stroke-width: 2;
    }

    .warning-mark text {
      fill: white;
      font-size: 12px;
      font-weight: 900;
    }

    .detail-card,
    .summary-card,
    .result-card,
    .issue-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, .03);
    }

    .summary-card + .summary-card,
    .detail-card + .detail-card,
    .issue-card + .issue-card {
      margin-top: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric-card {
      min-height: 86px;
      display: grid;
      gap: 4px;
      align-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 12px;
    }

    .metric-card.blue { border-color: #bdd8ff; background: var(--blue-soft); }
    .metric-card.green { border-color: #b9e4c8; background: var(--green-soft); }
    .metric-card.violet { border-color: #d7c6ff; background: var(--violet-soft); }
    .metric-card.red { border-color: #f4b7bd; background: var(--red-soft); }

    .metric-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-card strong {
      font-size: 24px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .metric-card small {
      color: var(--muted);
      font-size: 12px;
    }

    .detail-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 900;
    }

    .detail-header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .detail-header p {
      margin: 4px 0 0;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 8px 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .detail-section {
      margin-top: 16px;
    }

    .detail-section h3,
    .issue-body h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .issue-body {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .issue-body p {
      margin: 0;
      color: var(--muted);
    }

    .issue-body ul {
      margin: 0;
      padding-left: 18px;
    }

    .issue-body li + li {
      margin-top: 6px;
    }

    .relation-list,
    .result-list {
      display: grid;
      gap: 8px;
    }

    .relation-row,
    .result-card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 9px 10px;
      text-align: left;
    }

    .relation-row:hover,
    .result-card:hover {
      border-color: #8bb8ff;
      box-shadow: var(--shadow);
    }

    .relation-row strong,
    .relation-row span,
    .result-card strong,
    .result-card span {
      display: block;
      overflow-wrap: anywhere;
    }

    .relation-row span,
    .result-card span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      padding: 0 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .pill.direct { background: var(--green-soft); color: var(--green); }
    .pill.ai { background: var(--violet-soft); color: var(--violet); }
    .pill.issue { background: var(--red-soft); color: var(--red); }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 22px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    details.dev {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    details.dev summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 800;
    }

    details.dev pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      border-top: 1px solid var(--border);
      padding: 12px;
      color: var(--muted);
      font: 12px/1.5 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1120px) {
      .topbar {
        grid-template-columns: minmax(260px, 1fr) auto;
      }

      .search-box {
        grid-column: 1 / -1;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .detail-panel {
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      .detail-scroll {
        height: auto;
      }

      .map-panel {
        height: 68vh;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .brand h1 {
        font-size: 21px;
      }

      .brand p {
        white-space: normal;
      }

      .stats {
        justify-content: stretch;
        overflow-x: auto;
      }

      .map-area {
        padding: 14px;
      }

      .map-panel {
        min-height: 440px;
        height: 62vh;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>SkillGraph Cartographer</h1>
          <p>スキルの関係を、わかりやすく確認するツール</p>
        </div>
      </div>

      <label class="search-box" for="globalSearch">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="スキル名・目的・説明・ファイル名で検索...">
      </label>

      <div class="stats" aria-label="全体の件数">
        <span class="stat"><strong id="totalSkills">0</strong> スキル</span>
        <span class="stat"><strong id="totalRelations">0</strong> つながり</span>
        <button id="issueButton" class="stat issue-button" type="button">
          確認が必要 <strong id="totalIssues">0</strong> 件
        </button>
      </div>
    </header>

    <div class="workspace">
      <main class="map-area">
        <section class="map-panel">
          <div class="panel-head">
            <h2>スキルのつながり</h2>
            <div class="legend" aria-label="地図の凡例">
              <span class="legend-item"><span class="line-sample"></span>直接書かれている関係</span>
              <span class="legend-item"><span class="line-sample ai"></span>AI が読み取った関係</span>
              <span class="legend-item"><span class="cluster-sample"></span>スキルのまとまり</span>
              <span class="legend-item"><span class="warning-sample">!</span>確認が必要</span>
            </div>
          </div>
          <div class="map-stage">
            <svg id="skillMap" role="img" aria-label="スキルのつながり"></svg>
            <div class="map-empty" id="mapEmpty" hidden>表示できるスキルがありません。</div>
          </div>
        </section>
      </main>

      <aside class="detail-panel" aria-label="説明">
        <div class="detail-scroll" id="detailPanel"></div>
      </aside>
    </div>
  </div>

  <script>
    let graph = __GRAPH_JSON__;
    if (!graph) {
      const request = new XMLHttpRequest();
      request.open("GET", "/graph.json", false);
      request.send(null);
      graph = JSON.parse(request.responseText);
    }

    const state = {
      selected: null,
      panelMode: "overall",
      searchQuery: "",
      view: { x: 0, y: 0, scale: 1 },
      pendingFit: true,
      panning: null,
    };

    graph.nodes = Array.isArray(graph.nodes) ? graph.nodes : [];
    graph.edges = Array.isArray(graph.edges) ? graph.edges : [];
    graph.diagnostics = Array.isArray(graph.diagnostics) ? graph.diagnostics : [];
    graph.nodeAnnotations = Array.isArray(graph.nodeAnnotations) ? graph.nodeAnnotations : [];
    graph.inferredEdges = Array.isArray(graph.inferredEdges) ? graph.inferredEdges : [];

    const nodeIndex = new Map(graph.nodes.map(node => [node.id, node]));
    const edgeIndex = new Map(graph.edges.map(edge => [edge.id, edge]));

    const issueCopy = {
      dangling_reference: {
        title: "参照先が見つかりません",
        what: "このスキルは別の SKILL.md を参照していますが、参照先のファイルが見つかりません。",
        why: "このスキルを読んだ人や AI が、次に読むべきスキルを開けない可能性があります。",
        action: ["パスが間違っていないか確認する", "参照先のスキルを追加する", "不要な参照なら削除する"],
      },
      duplicate_alias: {
        title: "同じ呼び名のスキルがあります",
        what: "同じ呼び名で複数のスキルが見つかります。",
        why: "人や AI が、どちらのスキルを使えばよいか判断しにくくなります。",
        action: ["用途が分かる具体的な名前にする", "似た名前が必要な場合は説明で違いを明確にする"],
      },
      skill_copy_drift: {
        title: "置き場所ごとにスキル内容が違います",
        what: "同じスキルとして扱われる SKILL.md が複数ありますが、ファイルの中身が一致していません。",
        why: "人が見ているスキルと、Codex や Claude Code が読んでいるスキルの内容が違う可能性があります。",
        action: ["どちらを正しい内容にするか決める", "意図しない違いなら片方を更新する", "意図的な違いなら、その理由を SKILL.md に書く"],
      },
      invalid_agent_annotation: {
        title: "AI が読み取った情報に不整合があります",
        what: "AI が追加した補足情報が、収集済みのスキルと対応していません。",
        why: "存在しないスキルへの補足が混ざると、関係の確認で誤解が起きる可能性があります。",
        action: ["補足情報の対象スキルを確認する", "不要な補足なら削除する", "対象名が変わっている場合は合わせる"],
      },
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function compactText(value, maxLength = 120) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      return `${text.slice(0, Math.max(0, maxLength - 3)).trim()}...`;
    }

    function isAiRelation(relation) {
      return relation.inferred || relation.origin === "agent_inferred";
    }

    function relationKindLabel(relation) {
      return isAiRelation(relation) ? "AI が読み取った関係" : "直接書かれている関係";
    }

    function relationTypeText(relation) {
      const value = String(relation.type || "").toLowerCase();
      const labels = {
        direct_reference: "参照",
        depends_on: "利用・依存",
        related_to: "関連",
        supports: "補助",
        alternative: "代替候補",
        overlap: "重なり",
        sequence: "前後関係",
        sequencing: "前後関係",
        prerequisite: "前提",
      };
      return labels[value] || "関係";
    }

    function relationSourceItems(relation) {
      return Array.isArray(relation.evidence) ? relation.evidence : [];
    }

    function relationReasonText(relation) {
      if (isAiRelation(relation)) {
        const reason = String(relation.rationale || "").trim();
        if (reason) return reason;
        return "SKILL.md の本文から、一緒に確認するとよい関係として読み取られています。";
      }
      return "SKILL.md に相手スキルへのリンクまたはファイルパスが書かれているため表示しています。";
    }

    function evidenceText(item) {
      if (!item || typeof item !== "object") return "";
      const path = item.path || item.section || "";
      const line = item.startLine ? `${item.startLine}行目${item.endLine && item.endLine !== item.startLine ? `-${item.endLine}行目` : ""}` : "";
      const text = item.text || item.raw || item.value || "";
      return [path, line, text ? `「${compactText(text, 80)}」` : ""].filter(Boolean).join(" ");
    }

    function skillName(id) {
      const node = nodeIndex.get(id);
      if (!node) return id || "";
      return node.annotation?.label || node.label || node.name || node.id;
    }

    function skillSummary(node) {
      return node.annotation?.summary || node.description || "説明はまだ追加されていません。";
    }

    function skillGroupKey(node) {
      return node.annotation?.suggestedCategory || node.annotation?.clusterId || node.category || "未分類";
    }

    function groupDisplayName(key) {
      const value = String(key || "").trim();
      if (!value || value === "Uncategorized" || value === "未分類") return "未分類";
      return value
        .split(/[._-]+/)
        .filter(Boolean)
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join(" ");
    }

    function clusterEntries() {
      const counts = new Map();
      for (const node of graph.nodes) {
        const key = skillGroupKey(node);
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return [...counts.entries()]
        .map(([key, count]) => ({ key, label: groupDisplayName(key), count }))
        .sort((left, right) => right.count - left.count || left.label.localeCompare(right.label));
    }

    function skillPath(node) {
      return node.path || (Array.isArray(node.paths) ? node.paths[0] : "") || "";
    }

    function searchableSkillText(node) {
      return [
        node.id,
        node.label,
        node.name,
        node.description,
        node.path,
        ...(node.aliases || []),
        node.annotation?.label,
        node.annotation?.summary,
        ...(node.annotation?.triggerPhrases || []),
      ].join(" ").toLowerCase();
    }

    function matchingSkills() {
      const query = state.searchQuery.trim().toLowerCase();
      if (!query) return [];
      return graph.nodes.filter(node => searchableSkillText(node).includes(query));
    }

    function relationsForSkill(id) {
      return graph.edges.filter(relation => relation.source === id || relation.target === id);
    }

    function issuesForSkill(node) {
      const paths = [node.path, node.dir, ...(node.paths || []), ...(node.dirs || [])].filter(Boolean);
      return graph.diagnostics.filter(item => {
        if (item.skill === node.id || item.target === node.id) return true;
        if (paths.some(path => item.path === path || String(item.path || "").startsWith(`${path}/`))) return true;
        const skills = item.evidence && Array.isArray(item.evidence.skills) ? item.evidence.skills : [];
        return skills.includes(node.id);
      });
    }

    function issueSkillIds() {
      const ids = new Set();
      for (const item of graph.diagnostics) {
        if (nodeIndex.has(item.skill)) ids.add(item.skill);
        if (nodeIndex.has(item.target)) ids.add(item.target);
        const skills = item.evidence && Array.isArray(item.evidence.skills) ? item.evidence.skills : [];
        for (const id of skills) {
          if (nodeIndex.has(id)) ids.add(id);
        }
      }
      return ids;
    }

    function issueLabel(type) {
      return issueCopy[type]?.title || "確認が必要な項目";
    }

    function issueActionList(item) {
      const actions = issueCopy[item.type]?.action || ["内容を確認し、必要なら SKILL.md を更新する"];
      return actions.map(action => `<li>${escapeHtml(action)}</li>`).join("");
    }

    function directRelationCount() {
      return graph.edges.filter(relation => !isAiRelation(relation)).length;
    }

    function aiRelationCount() {
      return graph.edges.filter(isAiRelation).length;
    }

    function setSelection(kind, value) {
      state.selected = { kind, value };
      state.panelMode = "selection";
      render();
    }

    function clearSelection() {
      state.selected = null;
      state.panelMode = state.searchQuery.trim() ? "search" : "overall";
      render();
    }

    function showIssues() {
      state.selected = null;
      state.panelMode = "issues";
      render();
    }

    function render() {
      renderHeader();
      renderDetails();
      drawMap(document.getElementById("skillMap"));
    }

    function renderHeader() {
      document.getElementById("totalSkills").textContent = String(graph.nodes.length);
      document.getElementById("totalRelations").textContent = String(graph.edges.length);
      document.getElementById("totalIssues").textContent = String(graph.diagnostics.length);
      document.getElementById("globalSearch").value = state.searchQuery;
      document.getElementById("issueButton").classList.toggle("active", state.panelMode === "issues");
    }

    function renderDetails() {
      const panel = document.getElementById("detailPanel");
      if (state.panelMode === "issues") {
        panel.innerHTML = issuesPanelHtml();
      } else if (state.selected?.kind === "skill") {
        panel.innerHTML = skillDetailsHtml(state.selected.value);
      } else if (state.selected?.kind === "relation") {
        panel.innerHTML = relationDetailsHtml(state.selected.value);
      } else if (state.searchQuery.trim()) {
        panel.innerHTML = searchDetailsHtml();
      } else {
        panel.innerHTML = overallDetailsHtml();
      }
      bindDetailActions(panel);
    }

    function overallDetailsHtml() {
      return `
        <h2 class="section-title">全体のまとめ</h2>
        <section class="summary-grid" aria-label="全体の件数">
          <div class="metric-card blue">
            <span>スキル</span>
            <strong>${graph.nodes.length}</strong>
            <small>読み取った SKILL.md</small>
          </div>
          <div class="metric-card green">
            <span>直接書かれている関係</span>
            <strong>${directRelationCount()}</strong>
            <small>リンクやファイルパス</small>
          </div>
          <div class="metric-card violet">
            <span>AI が読み取った関係</span>
            <strong>${aiRelationCount()}</strong>
            <small>本文から判断した関係</small>
          </div>
          <div class="metric-card red">
            <span>確認が必要</span>
            <strong>${graph.diagnostics.length}</strong>
            <small>見ておきたい項目</small>
          </div>
        </section>
        <section class="summary-card">
          <h3 class="sub-title">見方</h3>
          <p class="muted">中央の地図では、スキル同士の関係を線で確認できます。実線は直接書かれている関係、点線は AI が読み取った関係です。</p>
          <p class="muted">背景の枠は、SKILL.md の内容から読み取ったスキルのまとまりです。検索すると該当するスキルが地図上で強調されます。</p>
        </section>
        <section class="summary-card">
          <h3 class="sub-title">スキルのまとまり</h3>
          <div class="relation-list">
            ${clusterEntries().map(entry => `<div class="relation-row"><strong>${escapeHtml(entry.label)}</strong><span>${entry.count} スキル</span></div>`).join("") || `<div class="empty">まとまりはまだ読み取られていません。</div>`}
          </div>
        </section>
      `;
    }

    function searchDetailsHtml() {
      const results = matchingSkills();
      return `
        <h2 class="section-title">検索結果</h2>
        <section class="detail-card">
          <p class="muted">${results.length ? `${results.length} 件のスキルが見つかりました。地図上でも強調しています。` : "条件に合うスキルは見つかりませんでした。"}</p>
          <div class="result-list">
            ${results.map(node => skillResultHtml(node)).join("") || `<div class="empty">別の言葉で検索してください。</div>`}
          </div>
        </section>
      `;
    }

    function skillResultHtml(node) {
      const issueCount = issuesForSkill(node).length;
      return `
        <button class="result-card" type="button" data-skill-id="${escapeHtml(node.id)}">
          <strong>${escapeHtml(skillName(node.id))}</strong>
          <span>${escapeHtml(skillSummary(node))}</span>
          <span class="pill-row">
            <span class="pill">${escapeHtml(skillPath(node))}</span>
            ${issueCount ? `<span class="pill issue">確認が必要 ${issueCount} 件</span>` : ""}
          </span>
        </button>
      `;
    }

    function skillDetailsHtml(node) {
      const relations = relationsForSkill(node.id);
      const issues = issuesForSkill(node);
      return `
        <h2 class="section-title">選択中のスキル</h2>
        <section class="detail-card">
          <div class="detail-header">
            <span class="detail-icon">S</span>
            <div>
              <h2>${escapeHtml(skillName(node.id))}</h2>
              <p>${escapeHtml(skillSummary(node))}</p>
            </div>
          </div>
          <div class="file-row">${escapeHtml(skillPath(node))}</div>
          <div class="pill-row">
            <span class="pill">${escapeHtml(groupDisplayName(skillGroupKey(node)))}</span>
          </div>
          <div class="detail-section">
            <h3>関係しているスキル</h3>
            ${relations.length ? `<div class="relation-list">${relations.map(relation => relationRowHtml(relation, node.id)).join("")}</div>` : `<p class="muted">このスキルにつながる関係はありません。</p>`}
          </div>
          <div class="detail-section">
            <h3>確認が必要な項目</h3>
            ${issues.length ? `<div class="relation-list">${issues.map(item => `<div class="relation-row"><strong>${escapeHtml(issueLabel(item.type))}</strong><span>${escapeHtml(issueSummary(item))}</span></div>`).join("")}</div>` : `<p class="muted">このスキルに紐づく項目はありません。</p>`}
          </div>
          ${devDetails({ id: node.id, path: skillPath(node), aliases: node.aliases || [] })}
        </section>
      `;
    }

    function relationRowHtml(relation, currentSkillId) {
      const otherId = relation.source === currentSkillId ? relation.target : relation.source;
      return `
        <button class="relation-row" type="button" data-relation-id="${escapeHtml(relation.id)}">
          <strong>${escapeHtml(skillName(otherId))}</strong>
          <span>${escapeHtml(relationKindLabel(relation))} / ${escapeHtml(relationTypeText(relation))}</span>
        </button>
      `;
    }

    function relationDetailsHtml(relation) {
      const evidence = relationSourceItems(relation);
      return `
        <h2 class="section-title">つながりの詳細</h2>
        <section class="detail-card">
          <p><strong>${escapeHtml(skillName(relation.source))}</strong><br>→ ${escapeHtml(skillName(relation.target))}</p>
          <div class="detail-section">
            <h3>つながりの種類</h3>
            <p class="muted">${escapeHtml(relationKindLabel(relation))} / ${escapeHtml(relationTypeText(relation))}</p>
          </div>
          <div class="detail-section">
            <h3>なぜ表示されているか</h3>
            <p class="muted">${escapeHtml(relationReasonText(relation))}</p>
          </div>
          <div class="detail-section">
            <h3>根拠</h3>
            ${evidence.length ? `<div class="relation-list">${evidence.map(item => `<div class="relation-row"><strong>${escapeHtml(evidenceText(item) || "根拠")}</strong></div>`).join("")}</div>` : `<p class="muted">根拠は追加されていません。</p>`}
          </div>
          <div class="detail-section">
            <h3>注意書き</h3>
            <p class="muted">${isAiRelation(relation) ? "これは SKILL.md に直接リンクが書かれている関係ではありません。AI が本文から読み取った補足情報です。" : "これは SKILL.md に直接書かれている参照から見つかった関係です。"}</p>
          </div>
          ${devDetails({ id: relation.id, type: relation.type, origin: relation.origin, inferred: Boolean(relation.inferred) })}
        </section>
      `;
    }

    function issuesPanelHtml() {
      return `
        <h2 class="section-title">確認が必要な項目</h2>
        ${graph.diagnostics.length ? graph.diagnostics.map(issueDetailsCardHtml).join("") : `<div class="empty">確認が必要な項目は見つかっていません。</div>`}
      `;
    }

    function issueDetailsCardHtml(item) {
      const copy = issueCopy[item.type] || issueCopy.invalid_agent_annotation;
      const evidenceLines = issueSourceLines(item);
      return `
        <section class="issue-card">
          <div class="detail-header">
            <span class="detail-icon" style="background:var(--red);">!</span>
            <div>
              <h2>${escapeHtml(copy.title)}</h2>
              <p>${escapeHtml(issueSummary(item))}</p>
            </div>
          </div>
          <div class="issue-body">
            <section>
              <h4>何が起きているか</h4>
              <p>${escapeHtml(copy.what)}</p>
            </section>
            <section>
              <h4>なぜ困るか</h4>
              <p>${escapeHtml(copy.why)}</p>
            </section>
            <section>
              <h4>根拠</h4>
              ${evidenceLines.length ? `<ul>${evidenceLines.map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>` : `<p>追加の根拠はありません。</p>`}
            </section>
            <section>
              <h4>次にすること</h4>
              <ul>${issueActionList(item)}</ul>
            </section>
          </div>
          ${devDetails({ internalName: item.type, message: item.message, evidence: item.evidence || {} })}
        </section>
      `;
    }

    function issueSummary(item) {
      if (item.skill && nodeIndex.has(item.skill)) return skillName(item.skill);
      if (item.path) return item.path;
      if (item.target && nodeIndex.has(item.target)) return skillName(item.target);
      if (item.target) return String(item.target);
      return issueLabel(item.type);
    }

    function issueSourceLines(item) {
      const lines = [];
      if (item.path) lines.push(item.path);
      if (item.skill) lines.push(`対象のスキル: ${skillName(item.skill)}`);
      if (item.target) lines.push(`参照している先: ${item.target}`);
      const evidence = item.evidence;
      if (evidence && typeof evidence === "object") {
        if (evidence.path || evidence.text || evidence.raw) lines.push(evidenceText(evidence));
        if (Array.isArray(evidence.skills)) lines.push(`該当するスキル: ${evidence.skills.map(skillName).join(", ")}`);
        if (Array.isArray(evidence.aliases)) {
          for (const alias of evidence.aliases) {
            lines.push(`${skillName(alias.skill)} / ${alias.path || ""} / ${alias.source || ""}`);
          }
        }
        if (Array.isArray(evidence.copies)) {
          for (const copy of evidence.copies) {
            lines.push(`${copy.host || "unknown"}: ${copy.path || ""}`);
          }
        }
      }
      return lines.filter(Boolean);
    }

    function devDetails(value) {
      return `
        <details class="dev">
          <summary>開発者向け情報</summary>
          <pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre>
        </details>
      `;
    }

    function bindDetailActions(root) {
      for (const button of root.querySelectorAll("[data-skill-id]")) {
        button.addEventListener("click", () => {
          const node = nodeIndex.get(button.dataset.skillId);
          if (node) setSelection("skill", node);
        });
      }
      for (const button of root.querySelectorAll("[data-relation-id]")) {
        button.addEventListener("click", () => {
          const relation = edgeIndex.get(button.dataset.relationId);
          if (relation) setSelection("relation", relation);
        });
      }
    }

    function drawMap(svg) {
      const width = Math.max(360, svg.clientWidth || svg.parentElement.clientWidth || 720);
      const height = Math.max(320, svg.clientHeight || svg.parentElement.clientHeight || 520);
      const nodes = graph.nodes;
      const nodeIds = new Set(nodes.map(node => node.id));
      const relations = graph.edges.filter(relation => nodeIds.has(relation.source) && nodeIds.has(relation.target));
      document.getElementById("mapEmpty").hidden = nodes.length > 0;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `
        <defs>
          <marker id="arrowDirect" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2368d8"></path></marker>
          <marker id="arrowAi" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7b4ce2"></path></marker>
          <marker id="arrowSelected" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d92d3a"></path></marker>
        </defs>
      `;
      if (!nodes.length) return;
      const bounds = layoutBounds(nodes, width, height);
      if (state.pendingFit) {
        const scale = Math.min(1, width / Math.max(1, bounds.width), height / Math.max(1, bounds.height));
        state.view = {
          x: (width - bounds.width * scale) / 2,
          y: (height - bounds.height * scale) / 2,
          scale,
        };
        state.pendingFit = false;
      }
      const layer = svgElement("g", { transform: `translate(${state.view.x} ${state.view.y}) scale(${state.view.scale})` });
      svg.append(layer);
      const layout = layoutPositions(nodes, bounds.width, bounds.height);
      const positions = layout.positions;
      for (const region of layout.regions) {
        drawClusterRegion(layer, region);
      }
      const occurrence = new Map();
      for (const relation of relations) {
        const source = positions.get(relation.source);
        const target = positions.get(relation.target);
        if (!source || !target) continue;
        const key = `${relation.source}->${relation.target}`;
        const index = occurrence.get(key) || 0;
        occurrence.set(key, index + 1);
        drawRelation(layer, relation, source, target, index);
      }
      for (const node of nodes) {
        const point = positions.get(node.id);
        if (point) drawSkill(layer, node, point);
      }
      bindMapGestures(svg);
    }

    function layoutBounds(nodes, width, height) {
      const count = Math.max(1, nodes.length);
      const columns = Math.max(1, Math.ceil(Math.sqrt(count)));
      const rows = Math.max(1, Math.ceil(count / columns));
      return {
        width: Math.max(width, columns * 220 + 120),
        height: Math.max(height, rows * 150 + 120),
      };
    }

    function layoutPositions(nodes, width, height) {
      const grouped = new Map();
      for (const node of nodes) {
        const key = skillGroupKey(node);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(node);
      }
      const groupEntries = [...grouped.entries()];
      const groupColumns = Math.max(1, Math.ceil(Math.sqrt(groupEntries.length)));
      const groupRows = Math.max(1, Math.ceil(groupEntries.length / groupColumns));
      const groupWidth = width / groupColumns;
      const groupHeight = height / groupRows;
      const positions = new Map();
      const regions = [];
      groupEntries.forEach(([category, values], groupIndex) => {
        const gx = groupIndex % groupColumns;
        const gy = Math.floor(groupIndex / groupColumns);
        regions.push({
          key: category,
          label: groupDisplayName(category),
          count: values.length,
          x: gx * groupWidth + 18,
          y: gy * groupHeight + 18,
          width: Math.max(140, groupWidth - 36),
          height: Math.max(110, groupHeight - 36),
        });
        const cols = Math.max(1, Math.ceil(Math.sqrt(values.length)));
        const rows = Math.max(1, Math.ceil(values.length / cols));
        values.forEach((node, index) => {
          const col = index % cols;
          const row = Math.floor(index / cols);
          const x = gx * groupWidth + ((col + 1) / (cols + 1)) * groupWidth;
          const y = gy * groupHeight + ((row + 1) / (rows + 1)) * groupHeight;
          positions.set(node.id, { x, y, category });
        });
      });
      return { positions, regions };
    }

    function focusInfo() {
      const queryIds = new Set(matchingSkills().map(node => node.id));
      const issueIds = issueSkillIds();
      const relatedIds = new Set();
      const focusedRelationIds = new Set();
      if (state.selected?.kind === "skill") {
        const id = state.selected.value.id;
        relatedIds.add(id);
        for (const relation of relationsForSkill(id)) {
          focusedRelationIds.add(relation.id);
          relatedIds.add(relation.source);
          relatedIds.add(relation.target);
        }
      }
      if (state.selected?.kind === "relation") {
        const relation = state.selected.value;
        focusedRelationIds.add(relation.id);
        relatedIds.add(relation.source);
        relatedIds.add(relation.target);
      }
      return {
        queryIds,
        issueIds,
        relatedIds,
        focusedRelationIds,
        hasFocus: queryIds.size > 0 || relatedIds.size > 0 || state.panelMode === "issues",
      };
    }

    function drawRelation(layer, relation, source, target, index) {
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const offset = ((index % 5) - 2) * 16;
      const sx = source.x + (dx / distance) * 76;
      const sy = source.y + (dy / distance) * 28;
      const tx = target.x - (dx / distance) * 76;
      const ty = target.y - (dy / distance) * 28;
      const mx = (sx + tx) / 2 - (dy / distance) * offset;
      const my = (sy + ty) / 2 + (dx / distance) * offset;
      const d = `M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}`;
      const focus = focusInfo();
      const selected = state.selected?.kind === "relation" && state.selected.value.id === relation.id;
      const relevantToSearch = focus.queryIds.has(relation.source) || focus.queryIds.has(relation.target);
      const relevantToIssue = state.panelMode === "issues" && (focus.issueIds.has(relation.source) || focus.issueIds.has(relation.target));
      const focused = selected || focus.focusedRelationIds.has(relation.id) || relevantToSearch || relevantToIssue;
      const dim = focus.hasFocus && !focused;
      const hit = svgElement("path", { class: "relation-hit", d });
      hit.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("relation", relation);
      });
      const path = svgElement("path", {
        class: `relation-path ${isAiRelation(relation) ? "ai" : ""} ${selected ? "selected" : ""} ${focused ? "focused" : ""} ${dim ? "dim" : ""}`,
        d,
        "marker-end": selected ? "url(#arrowSelected)" : isAiRelation(relation) ? "url(#arrowAi)" : "url(#arrowDirect)",
      });
      path.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("relation", relation);
      });
      layer.append(hit, path);
    }

    function drawClusterRegion(layer, region) {
      const group = svgElement("g", {
        class: "cluster-region",
        transform: `translate(${region.x} ${region.y})`,
      });
      group.append(svgElement("rect", { width: region.width, height: region.height, rx: 8 }));
      const label = svgElement("text", { x: 14, y: 24 });
      label.textContent = compactText(region.label, 26);
      const count = svgElement("text", { class: "cluster-count", x: 14, y: 43 });
      count.textContent = `${region.count} スキル`;
      group.append(label, count);
      layer.append(group);
    }

    function drawSkill(layer, node, point) {
      const focus = focusInfo();
      const selected = state.selected?.kind === "skill" && state.selected.value.id === node.id;
      const searched = focus.queryIds.has(node.id);
      const related = focus.relatedIds.has(node.id);
      const hasIssue = issuesForSkill(node).length > 0;
      const issueFocused = state.panelMode === "issues" && focus.issueIds.has(node.id);
      const hasAi = relationsForSkill(node.id).some(isAiRelation);
      const dim = focus.hasFocus && !(selected || searched || related || issueFocused);
      const group = svgElement("g", {
        class: `skill-node ${hasAi ? "ai" : ""} ${selected ? "selected" : ""} ${searched ? "search" : ""} ${related ? "related" : ""} ${issueFocused ? "issue" : ""} ${dim ? "dim" : ""}`,
        transform: `translate(${point.x - 78} ${point.y - 24})`,
      });
      group.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("skill", node);
      });
      group.append(svgElement("rect", { width: 156, height: 48, rx: 8 }));
      const label = svgElement("text", { x: 78, y: 29, "text-anchor": "middle" });
      label.textContent = compactText(skillName(node.id), 20);
      group.append(label);
      if (hasIssue) {
        const warning = svgElement("g", { class: "warning-mark", transform: "translate(145 -9)" });
        warning.append(svgElement("title", {}));
        warning.querySelector("title").textContent = "確認が必要な項目があります";
        warning.append(svgElement("circle", { cx: 0, cy: 0, r: 10 }));
        const text = svgElement("text", { x: 0, y: 4, "text-anchor": "middle" });
        text.textContent = "!";
        warning.append(text);
        group.append(warning);
      }
      layer.append(group);
    }

    function svgElement(name, attrs) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs || {})) {
        element.setAttribute(key, String(value));
      }
      return element;
    }

    function zoomMap(factor, originX, originY) {
      const before = state.view.scale;
      const next = Math.max(.28, Math.min(2.6, before * factor));
      if (next === before) return;
      if (Number.isFinite(originX) && Number.isFinite(originY)) {
        state.view.x = originX - ((originX - state.view.x) / before) * next;
        state.view.y = originY - ((originY - state.view.y) / before) * next;
      }
      state.view.scale = next;
      drawMap(document.getElementById("skillMap"));
    }

    function bindMapGestures(svg) {
      svg.onwheel = event => {
        event.preventDefault();
        const rect = svg.getBoundingClientRect();
        zoomMap(event.deltaY < 0 ? 1.12 : 1 / 1.12, event.clientX - rect.left, event.clientY - rect.top);
      };
      svg.onpointerdown = event => {
        if (event.target !== svg) return;
        svg.setPointerCapture(event.pointerId);
        state.panning = { id: event.pointerId, x: event.clientX, y: event.clientY, startX: state.view.x, startY: state.view.y, moved: false };
      };
      svg.onpointermove = event => {
        if (!state.panning || state.panning.id !== event.pointerId) return;
        const dx = event.clientX - state.panning.x;
        const dy = event.clientY - state.panning.y;
        if (Math.hypot(dx, dy) > 3) state.panning.moved = true;
        state.view.x = state.panning.startX + dx;
        state.view.y = state.panning.startY + dy;
        drawMap(svg);
      };
      svg.onpointerup = event => {
        if (!state.panning || state.panning.id !== event.pointerId) return;
        const moved = state.panning.moved;
        state.panning = null;
        if (!moved) clearSelection();
      };
      svg.onpointercancel = () => {
        state.panning = null;
      };
    }

    document.getElementById("globalSearch").addEventListener("input", event => {
      state.searchQuery = event.target.value;
      state.selected = null;
      state.panelMode = state.searchQuery.trim() ? "search" : "overall";
      render();
    });

    document.getElementById("issueButton").addEventListener("click", showIssues);

    window.addEventListener("resize", () => {
      state.pendingFit = true;
      render();
    });

    render();
  </script>
</body>
</html>
