<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillGraph Cartographer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --surface-strong: #eef3f8;
      --text: #111827;
      --muted: #526173;
      --faint: #7a8796;
      --border: #dbe3ec;
      --blue: #2368d8;
      --blue-soft: #edf5ff;
      --green: #1f9d57;
      --green-soft: #edf9f1;
      --violet: #7b4ce2;
      --violet-soft: #f3edff;
      --red: #d92d3a;
      --red-soft: #fff0f1;
      --orange: #e06a1b;
      --orange-soft: #fff3e8;
      --shadow: 0 12px 30px rgba(15, 23, 42, .08);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      background: var(--bg);
    }

    .topbar {
      min-height: 76px;
      display: grid;
      grid-template-columns: minmax(270px, 420px) minmax(260px, 1fr) auto;
      gap: 18px;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      position: relative;
    }

    .brand-mark svg {
      width: 30px;
      height: 30px;
      display: block;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-box {
      min-width: 0;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 13px;
      background: var(--surface);
    }

    .search-box:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 104, 216, .14);
    }

    .search-icon {
      width: 18px;
      height: 18px;
      border: 2px solid var(--muted);
      border-radius: 999px;
      position: relative;
      flex: 0 0 auto;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 2px;
      right: -7px;
      bottom: -4px;
      border-radius: 999px;
      background: var(--muted);
      transform: rotate(45deg);
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      white-space: nowrap;
    }

    .stat {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 13px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
    }

    .stat strong {
      color: var(--text);
      font-size: 20px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat.issue {
      border-color: #f4b7bd;
      background: var(--red-soft);
      color: var(--red);
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(236px, 300px) minmax(0, 1fr) minmax(280px, 350px);
    }

    .nav,
    .side {
      min-width: 0;
      border-right: 1px solid var(--border);
      background: rgba(255, 255, 255, .78);
    }

    .side {
      border-right: 0;
      border-left: 1px solid var(--border);
    }

    .scroll {
      height: calc(100vh - 77px);
      overflow: auto;
      padding: 20px;
    }

    .main {
      min-width: 0;
      min-height: 0;
    }

    .main .scroll {
      padding: 20px 22px 28px;
    }

    h2,
    h3,
    p {
      margin-top: 0;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sub-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
    }

    .tiny {
      color: var(--faint);
      font-size: 12px;
    }

    .nav-title {
      margin: 0 0 14px;
      font-size: 15px;
      line-height: 1.25;
    }

    .page-nav {
      display: grid;
      gap: 10px;
    }

    .nav-card {
      width: 100%;
      min-height: 68px;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 10px 12px;
      text-align: left;
    }

    .nav-card:hover,
    .nav-card.active {
      border-color: #8bb8ff;
      background: var(--blue-soft);
    }

    .nav-card.active {
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .nav-card-body strong,
    .nav-card-body span {
      display: block;
      overflow-wrap: anywhere;
    }

    .nav-card-body strong {
      color: var(--blue);
      font-weight: 800;
      line-height: 1.2;
    }

    .nav-card-body span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .nav-badge {
      min-width: 24px;
      height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      background: var(--red);
      color: white;
      font-size: 12px;
      font-weight: 800;
      justify-self: end;
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--surface-strong);
      color: var(--blue);
      font-weight: 900;
    }

    .nav-icon svg {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-icon-issues {
      background: var(--red-soft);
      color: var(--red);
    }

    .nav-card.active .nav-icon {
      background: var(--surface);
    }

    .hint,
    .control-box,
    .plain-box {
      margin-top: 22px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
    }

    .hint {
      background: var(--blue-soft);
      border-color: #b7d4ff;
    }

    .hint h3,
    .control-box h3,
    .plain-box h3 {
      margin: 0 0 10px;
      font-size: 14px;
    }

    .hint ul,
    .issue-body ul {
      margin: 0;
      padding-left: 18px;
    }

    .hint li + li,
    .issue-body li + li {
      margin-top: 7px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      color: var(--text);
      font-size: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .metric-card,
    .recommend-card,
    .skill-card,
    .issue-card,
    .detail-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 14px;
      box-shadow: 0 1px 0 rgba(15, 23, 42, .03);
    }

    .metric-card {
      min-height: 92px;
      display: grid;
      gap: 4px;
      align-content: center;
    }

    .metric-card.blue { border-color: #bdd8ff; background: var(--blue-soft); }
    .metric-card.green { border-color: #b9e4c8; background: var(--green-soft); }
    .metric-card.violet { border-color: #d7c6ff; background: var(--violet-soft); }
    .metric-card.red { border-color: #f4b7bd; background: var(--red-soft); }

    .metric-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric-card strong {
      font-size: 26px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .metric-card small {
      color: var(--muted);
      font-size: 12px;
    }

    .map-panel,
    .list-panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden;
    }

    .panel-head {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .panel-head h2 {
      flex: 1 0 190px;
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .tools,
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-button,
    .text-button,
    .tab-button {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      padding: 0 11px;
      font-weight: 700;
    }

    .tool-button {
      width: 34px;
      padding: 0;
    }

    .text-button.primary,
    .tab-button.active {
      border-color: #8bb8ff;
      background: var(--blue-soft);
      color: var(--blue);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .line-sample {
      width: 26px;
      height: 0;
      border-top: 2px solid var(--blue);
    }

    .line-sample.ai {
      border-top-color: var(--violet);
      border-top-style: dashed;
    }

    .map-stage {
      height: clamp(440px, 60vh, 680px);
      min-height: 420px;
      position: relative;
      background:
        linear-gradient(var(--surface-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--surface-strong) 1px, transparent 1px),
        var(--surface-soft);
      background-size: 30px 30px;
    }

    #skillMap {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .map-empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
    }

    .map-empty[hidden] {
      display: none;
    }

    .category-frame {
      fill: rgba(35, 104, 216, .05);
      stroke: rgba(35, 104, 216, .18);
      stroke-width: 1;
    }

    .category-label {
      fill: var(--blue);
      font-size: 12px;
      font-weight: 800;
      paint-order: stroke;
      stroke: white;
      stroke-width: 3px;
    }

    .relation-path {
      fill: none;
      stroke: var(--blue);
      stroke-width: 1.6;
      opacity: .72;
      cursor: pointer;
    }

    .relation-path.ai {
      stroke: var(--violet);
      stroke-dasharray: 7 5;
    }

    .relation-path.selected {
      stroke: var(--red);
      stroke-width: 2.4;
      opacity: 1;
    }

    .relation-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      cursor: pointer;
      pointer-events: stroke;
    }

    .skill-node {
      cursor: pointer;
    }

    .skill-node rect {
      fill: white;
      stroke: #8bb8ff;
      stroke-width: 1.4;
    }

    .skill-node.ai rect {
      stroke: #b99dff;
    }

    .skill-node.selected rect {
      fill: var(--blue-soft);
      stroke: var(--blue);
      stroke-width: 2.2;
    }

    .skill-node text {
      fill: var(--text);
      font-size: 12px;
      font-weight: 800;
      pointer-events: none;
    }

    .recommend-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .recommend-card {
      min-height: 76px;
      text-align: left;
    }

    .recommend-card strong,
    .skill-card strong,
    .issue-card strong {
      display: block;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .recommend-card span,
    .skill-card span,
    .issue-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-input {
      min-height: 40px;
      min-width: 240px;
      flex: 1 1 260px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 0 12px;
      outline: 0;
    }

    .filter-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(35, 104, 216, .14);
    }

    .skill-grid,
    .issue-grid {
      display: grid;
      gap: 12px;
    }

    .skill-grid {
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }

    .skill-card,
    .issue-card {
      width: 100%;
      text-align: left;
    }

    .skill-card:hover,
    .issue-card:hover,
    .recommend-card:hover,
    .tool-button:hover,
    .text-button:hover,
    .tab-button:hover {
      border-color: #8bb8ff;
      box-shadow: var(--shadow);
    }

    .skill-card.selected,
    .issue-card.selected {
      border-color: var(--blue);
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .pill-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      background: var(--surface-strong);
      color: var(--muted);
      padding: 0 8px;
      font-size: 11px;
      font-weight: 800;
    }

    .pill.direct { background: var(--green-soft); color: var(--green); }
    .pill.ai { background: var(--violet-soft); color: var(--violet); }
    .pill.issue { background: var(--red-soft); color: var(--red); }

    .issue-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .issue-body {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .issue-body h4 {
      margin: 0 0 3px;
      font-size: 13px;
    }

    .issue-body p {
      margin: 0;
      color: var(--muted);
    }

    .detail-header {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .detail-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-weight: 900;
    }

    .detail-header h2 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .detail-header p {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      padding: 8px 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1px solid var(--border);
      margin: 16px -20px 0;
      padding: 0 20px;
    }

    .tabs button {
      min-height: 42px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }

    .tabs button.active {
      border-bottom-color: var(--blue);
      color: var(--blue);
    }

    .detail-section {
      margin-top: 16px;
    }

    .detail-section h3 {
      margin: 0 0 9px;
      font-size: 14px;
    }

    .relation-list {
      display: grid;
      gap: 8px;
    }

    .relation-row {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 9px 10px;
      text-align: left;
    }

    .relation-row strong,
    .relation-row span {
      display: block;
      overflow-wrap: anywhere;
    }

    .relation-row span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    details.dev {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    details.dev summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 800;
    }

    details.dev pre {
      margin: 0;
      max-height: 260px;
      overflow: auto;
      border-top: 1px solid var(--border);
      padding: 12px;
      color: var(--muted);
      font: 12px/1.5 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 24px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1500px) {
      .layout {
        grid-template-columns: minmax(236px, 300px) minmax(0, 1fr);
      }

      .side {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--border);
      }

      .side .scroll {
        height: auto;
      }
    }

    @media (max-width: 1180px) {
      .topbar {
        grid-template-columns: minmax(260px, 1fr) auto;
      }

      .search-box {
        grid-column: 1 / -1;
      }

      .layout {
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      }
    }

    @media (max-width: 780px) {
      .topbar {
        position: static;
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .stats {
        justify-content: stretch;
        overflow-x: auto;
      }

      .layout {
        display: block;
      }

      .scroll {
        height: auto;
        padding: 16px;
      }

      .nav,
      .side {
        border: 0;
        border-bottom: 1px solid var(--border);
      }

      .summary-grid,
      .issue-summary,
      .recommend-grid {
        grid-template-columns: 1fr;
      }

      .map-stage {
        height: 460px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32">
            <path d="M8 22.5 22.5 9" stroke="#2368d8" stroke-width="3.2" stroke-linecap="round"></path>
            <circle cx="7" cy="24" r="4.2" fill="#2368d8"></circle>
            <circle cx="24.5" cy="7.5" r="4.2" fill="#1f9d57"></circle>
          </svg>
        </div>
        <div>
          <h1>SkillGraph Cartographer</h1>
          <p>スキルの関係を、わかりやすく確認するツール</p>
        </div>
      </div>

      <label class="search-box" for="globalSearch">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="globalSearch" type="search" autocomplete="off" placeholder="スキル名・目的・説明・ファイル名で検索...">
      </label>

      <div class="stats" aria-label="全体の件数">
        <span class="stat"><strong id="totalSkills">0</strong> スキル</span>
        <span class="stat"><strong id="totalRelations">0</strong> つながり</span>
        <span class="stat issue"><strong id="totalIssues">0</strong> 確認が必要</span>
      </div>
    </header>

    <div class="layout">
      <nav class="nav" aria-label="見る内容">
        <div class="scroll">
          <h2 class="nav-title">見る内容を選ぶ</h2>
          <div class="page-nav" id="pageNav"></div>

          <section class="hint">
            <h3>使い方のヒント</h3>
            <ul>
              <li>迷ったら「全体を把握する」から始めましょう</li>
              <li>リンクが書かれた関係と、AI の読み取り結果は見分けて確認できます</li>
              <li>気になる点は、どこを直せばよいかまで説明しています</li>
            </ul>
          </section>

          <section class="control-box" id="displayControls">
            <h3>表示を調整</h3>
            <label class="check-row"><input id="showDirectRelations" type="checkbox" checked> 直接書かれている関係を表示</label>
            <label class="check-row"><input id="showAiRelations" type="checkbox" checked> AI が読み取った関係を表示</label>
            <label class="check-row"><input id="showGroupFrames" type="checkbox"> グループの枠を表示</label>
          </section>
        </div>
      </nav>

      <main class="main">
        <div class="scroll" id="mainContent"></div>
      </main>

      <aside class="side" aria-label="詳細">
        <div class="scroll" id="detailPanel"></div>
      </aside>
    </div>
  </div>

  <script>
    let graph = __GRAPH_JSON__;
    if (!graph) {
      const request = new XMLHttpRequest();
      request.open("GET", "/graph.json", false);
      request.send(null);
      graph = JSON.parse(request.responseText);
    }

    const pages = {
      overview: "全体を把握する",
      relations: "つながりを確認する",
      issues: "気になる点を確認する",
      skills: "スキルを探す",
    };

    const pageDescriptions = {
      overview: "スキルの全体像と状態を確認",
      relations: "スキル同士の関係を見る",
      issues: "問題や不整合を見つける",
      skills: "スキルを検索して詳細を見る",
    };

    const pageIcons = {
      overview: '<svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5"></path><path d="M5.5 10v9h5v-5h3v5h5v-9"></path></svg>',
      relations: '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="3"></circle><circle cx="5" cy="18" r="3"></circle><circle cx="19" cy="18" r="3"></circle><path d="M10.4 7.7 6.6 15.2"></path><path d="M13.6 7.7 17.4 15.2"></path><path d="M8 18h8"></path></svg>',
      issues: '<svg viewBox="0 0 24 24"><path d="M12 4 21 20H3Z"></path><path d="M12 9v5"></path><path d="M12 17.5h.01"></path></svg>',
      skills: '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M16 16 21 21"></path></svg>',
    };

    const MAP_NODE_WIDTH = 136;
    const MAP_NODE_HEIGHT = 38;

    const state = {
      activePage: "overview",
      selected: null,
      searchQuery: "",
      localSkillSearch: "",
      selectedCategory: "すべて",
      showDirectRelations: true,
      showAiRelations: true,
      showGroupFrames: false,
      positions: {},
      view: { x: 0, y: 0, scale: 1 },
      pendingFit: true,
    };

    graph.nodes = Array.isArray(graph.nodes) ? graph.nodes : [];
    graph.edges = Array.isArray(graph.edges) ? graph.edges : [];
    graph.diagnostics = Array.isArray(graph.diagnostics) ? graph.diagnostics : [];
    graph.nodeAnnotations = Array.isArray(graph.nodeAnnotations) ? graph.nodeAnnotations : [];
    graph.inferredEdges = Array.isArray(graph.inferredEdges) ? graph.inferredEdges : [];
    graph.viewSuggestions = Array.isArray(graph.viewSuggestions) ? graph.viewSuggestions : [];

    const nodeIndex = new Map(graph.nodes.map(node => [node.id, node]));
    const edgeIndex = new Map(graph.edges.map(edge => [edge.id, edge]));

    const issueCopy = {
      dangling_reference: {
        title: "参照先が見つかりません",
        what: "このスキルは別の SKILL.md を参照していますが、参照先のファイルが見つかりません。",
        why: "このスキルを読んだ人や AI が、次に読むべきスキルを開けない可能性があります。",
        action: ["パスが間違っていないか確認する", "参照先のスキルを追加する", "不要な参照なら削除する"],
      },
      duplicate_alias: {
        title: "同じ呼び名のスキルがあります",
        what: "同じ呼び名で複数のスキルが見つかります。",
        why: "人や AI が、どちらのスキルを使えばよいか判断しにくくなります。",
        action: ["用途が分かる具体的な名前にする", "似た名前が必要な場合は説明で違いを明確にする"],
      },
      skill_copy_drift: {
        title: "置き場所ごとにスキル内容が違います",
        what: "同じスキルとして扱われる SKILL.md が複数ありますが、ファイルの中身が一致していません。",
        why: "人が見ているスキルと、Codex や Claude Code が読んでいるスキルの内容が違う可能性があります。",
        action: ["どちらを正しい内容にするか決める", "意図しない違いなら片方を更新する", "意図的な違いなら、その理由を SKILL.md に書く"],
      },
      invalid_agent_annotation: {
        title: "AI が読み取った情報に不整合があります",
        what: "AI が追加した補足情報が、収集済みのスキルと対応していません。",
        why: "存在しないスキルへの補足が混ざると、関係の確認で誤解が起きる可能性があります。",
        action: ["補足情報の対象スキルを確認する", "不要な補足なら削除する", "対象名が変わっている場合は合わせる"],
      },
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[char]));
    }

    function compactText(value, maxLength = 120) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      return `${text.slice(0, Math.max(0, maxLength - 3)).trim()}...`;
    }

    function isAiRelation(edge) {
      return edge.inferred || edge.origin === "agent_inferred";
    }

    function relationKindLabel(edge) {
      return isAiRelation(edge) ? "AI が読み取った関係" : "直接書かれている関係";
    }

    function relationTypeText(edge) {
      const value = String(edge.type || "related_to");
      if (value === "direct_reference") return "直接参照";
      if (value === "related_to") return "関連";
      if (value === "depends_on") return "参考にしている";
      return value.replaceAll("_", " ");
    }

    function relationSourceText(edge) {
      if (isAiRelation(edge)) {
        const reason = String(edge.rationale || "").trim();
        if (reason) return reason;
        return "SKILL.md の本文から、一緒に確認するとよい関係として読み取られています。";
      }
      const evidence = relationSourceItems(edge)[0];
      if (evidence?.path) {
        return `${skillName(edge.source)} の SKILL.md に、${skillName(edge.target)} へのリンクやパスが書かれています。`;
      }
      return "SKILL.md のリンクやパスから見つかった関係です。";
    }

    function relationSourceItems(edge) {
      return Array.isArray(edge.evidence) ? edge.evidence : [];
    }

    function evidenceText(item) {
      if (!item || typeof item !== "object") return "";
      const path = item.path || item.section || "";
      const line = item.startLine ? `${item.startLine}行目${item.endLine && item.endLine !== item.startLine ? `-${item.endLine}行目` : ""}` : "";
      const text = item.text || item.raw || item.value || "";
      return [path, line, text ? `「${compactText(text, 80)}」` : ""].filter(Boolean).join(" ");
    }

    function issueLabel(type) {
      return issueCopy[type]?.title || "確認が必要な項目";
    }

    function issueActionList(diag) {
      const actions = issueCopy[diag.type]?.action || ["内容を確認し、必要なら SKILL.md を更新する"];
      return actions.map(item => `<li>${escapeHtml(item)}</li>`).join("");
    }

    function skillName(id) {
      const node = nodeIndex.get(id);
      if (!node) return id || "";
      return node.annotation?.label || node.label || node.name || node.id;
    }

    function skillSummary(node) {
      return node.annotation?.summary || node.description || "説明はまだ追加されていません。";
    }

    function skillPath(node) {
      return node.path || (Array.isArray(node.paths) ? node.paths[0] : "") || "";
    }

    function categoryFor(node) {
      return node.annotation?.suggestedCategory || node.annotation?.clusterId || node.category || "未分類";
    }

    function categoryLabel(value) {
      const labels = {
        ddd_tactical: "ドメインモデリング",
        "ddd-tactical": "ドメインモデリング",
        architecture: "アーキテクチャ",
        quality: "品質・改善",
        Uncategorized: "未分類",
      };
      return labels[value] || value || "未分類";
    }

    function allCategories() {
      const values = [...new Set(graph.nodes.map(node => categoryFor(node)))].sort((a, b) => String(a).localeCompare(String(b), "ja"));
      return ["すべて", ...values];
    }

    function relationsForSkill(id) {
      return graph.edges.filter(edge => edge.source === id || edge.target === id);
    }

    function issuesForSkill(node) {
      const paths = [node.path, node.dir, ...(node.paths || []), ...(node.dirs || [])].filter(Boolean);
      return graph.diagnostics.filter(diag => {
        if (diag.skill === node.id || diag.target === node.id) return true;
        if (paths.some(path => diag.path === path || String(diag.path || "").startsWith(`${path}/`))) return true;
        const skills = diag.evidence && Array.isArray(diag.evidence.skills) ? diag.evidence.skills : [];
        return skills.includes(node.id);
      });
    }

    function visibleRelations() {
      return graph.edges.filter(edge => {
        if (isAiRelation(edge) && !state.showAiRelations) return false;
        if (!isAiRelation(edge) && !state.showDirectRelations) return false;
        const source = nodeIndex.get(edge.source);
        const target = nodeIndex.get(edge.target);
        if (!source || !target) return false;
        const q = state.searchQuery.trim().toLowerCase();
        if (!q) return true;
        return [
          skillName(edge.source),
          skillName(edge.target),
          skillPath(source),
          skillPath(target),
          relationTypeText(edge),
          relationSourceText(edge),
        ].some(value => String(value || "").toLowerCase().includes(q));
      });
    }

    function visibleSkills() {
      const query = (state.activePage === "skills" ? state.localSkillSearch : state.searchQuery).trim().toLowerCase();
      return graph.nodes.filter(node => {
        if (state.activePage === "skills" && state.selectedCategory !== "すべて" && categoryFor(node) !== state.selectedCategory) return false;
        if (!query) return true;
        const values = [
          node.id,
          node.label,
          node.name,
          node.description,
          node.path,
          ...(node.aliases || []),
          node.annotation?.label,
          node.annotation?.summary,
          categoryFor(node),
        ];
        return values.some(value => String(value || "").toLowerCase().includes(query));
      });
    }

    function issueCounts() {
      const counts = { dangling_reference: 0, duplicate_alias: 0, skill_copy_drift: 0, other: 0 };
      for (const diag of graph.diagnostics) {
        if (diag.type in counts) counts[diag.type] += 1;
        else counts.other += 1;
      }
      return counts;
    }

    function directRelationCount() {
      return graph.edges.filter(edge => !isAiRelation(edge)).length;
    }

    function aiRelationCount() {
      return graph.edges.filter(isAiRelation).length;
    }

    function setSelection(kind, value) {
      state.selected = { kind, value };
      render();
    }

    function clearSelection() {
      state.selected = null;
      render();
    }

    function setPage(page) {
      state.activePage = page;
      state.pendingFit = true;
      if (page === "overview") {
        state.selected = null;
      }
      render();
    }

    function render() {
      renderHeader();
      renderNavigation();
      renderMain();
      renderDetails();
      const map = document.getElementById("skillMap");
      if (map) drawMap(map);
    }

    function renderHeader() {
      document.getElementById("totalSkills").textContent = String(graph.nodes.length);
      document.getElementById("totalRelations").textContent = String(graph.edges.length);
      document.getElementById("totalIssues").textContent = String(graph.diagnostics.length);
      document.getElementById("globalSearch").value = state.searchQuery;
      document.getElementById("displayControls").hidden = !["overview", "relations"].includes(state.activePage);
      document.getElementById("showDirectRelations").checked = state.showDirectRelations;
      document.getElementById("showAiRelations").checked = state.showAiRelations;
      document.getElementById("showGroupFrames").checked = state.showGroupFrames;
    }

    function renderNavigation() {
      const nav = document.getElementById("pageNav");
      nav.innerHTML = Object.entries(pages).map(([key, label]) => `
        <button class="nav-card ${state.activePage === key ? "active" : ""}" type="button" data-page="${escapeHtml(key)}">
          <span class="nav-icon nav-icon-${escapeHtml(key)}" aria-hidden="true">${pageIcons[key] || ""}</span>
          <span class="nav-card-body">
            <strong>${escapeHtml(label)}</strong>
            <span>${escapeHtml(pageDescriptions[key])}</span>
          </span>
          ${key === "issues" && graph.diagnostics.length ? `<span class="nav-badge">${graph.diagnostics.length}</span>` : ""}
        </button>
      `).join("");
      for (const button of nav.querySelectorAll("[data-page]")) {
        button.addEventListener("click", () => setPage(button.dataset.page));
      }
    }

    function renderMain() {
      const main = document.getElementById("mainContent");
      if (state.activePage === "overview") main.innerHTML = overviewHtml();
      if (state.activePage === "relations") main.innerHTML = relationsHtml();
      if (state.activePage === "issues") main.innerHTML = issuesHtml();
      if (state.activePage === "skills") main.innerHTML = skillsHtml();
      bindMainActions(main);
    }

    function overviewHtml() {
      return `
        <h2 class="section-title">全体のまとめ</h2>
        <section class="summary-grid" aria-label="全体のまとめ">
          <div class="metric-card blue">
            <span>スキルの数</span>
            <strong>${graph.nodes.length}</strong>
            <small>このリポジトリ内の SKILL.md</small>
          </div>
          <div class="metric-card green">
            <span>直接書かれている関係</span>
            <strong>${directRelationCount()}</strong>
            <small>SKILL.md のリンクやパス</small>
          </div>
          <div class="metric-card violet">
            <span>AI が読み取った関係</span>
            <strong>${aiRelationCount()}</strong>
            <small>本文から判断した関係</small>
          </div>
          <div class="metric-card red">
            <span>確認が必要</span>
            <strong>${graph.diagnostics.length}</strong>
            <small>見ておきたい項目</small>
          </div>
        </section>
        ${mapPanelHtml("スキルのつながり（地図）", true)}
        <section class="recommend-grid" aria-label="まず見るおすすめ">
          <button class="recommend-card" type="button" data-recommend="entry">
            <strong>入口になりそうなスキル</strong>
            <span>最初に読むと理解が進みます</span>
          </button>
          <button class="recommend-card" type="button" data-recommend="groups">
            <strong>まとまりを見たいとき</strong>
            <span>関連するスキルをまとめて確認</span>
          </button>
          <button class="recommend-card" type="button" data-recommend="issues">
            <strong>気になる点を先に確認</strong>
            <span>問題を見つけて整理しましょう</span>
          </button>
        </section>
      `;
    }

    function relationsHtml() {
      return `
        <h2 class="section-title">つながりを確認する</h2>
        <div class="filter-row">
          <label class="check-row"><input id="mainDirectRelations" type="checkbox" ${state.showDirectRelations ? "checked" : ""}> 直接書かれている関係</label>
          <label class="check-row"><input id="mainAiRelations" type="checkbox" ${state.showAiRelations ? "checked" : ""}> AI が読み取った関係</label>
        </div>
        ${mapPanelHtml("スキルのつながり（地図）", false)}
        <section class="list-panel" style="margin-top:16px;">
          <div class="panel-head">
            <h2>つながりの一覧</h2>
            <span class="tiny">${visibleRelations().length} 件</span>
          </div>
          <div class="skill-grid" style="padding:14px;">
            ${visibleRelations().map(edge => relationCardHtml(edge)).join("") || `<div class="empty">表示できるつながりがありません。</div>`}
          </div>
        </section>
      `;
    }

    function issuesHtml() {
      const counts = issueCounts();
      return `
        <h2 class="section-title">気になる点</h2>
        <section class="issue-summary" aria-label="気になる点の概要">
          <div class="metric-card red"><span>確認が必要</span><strong>${graph.diagnostics.length}</strong><small>件</small></div>
          <div class="metric-card blue"><span>参照先が見つからない</span><strong>${counts.dangling_reference}</strong><small>件</small></div>
          <div class="metric-card violet"><span>同じ呼び名のスキルがあります</span><strong>${counts.duplicate_alias}</strong><small>件</small></div>
          <div class="metric-card green"><span>置き場所ごとにスキル内容が違います</span><strong>${counts.skill_copy_drift}</strong><small>件</small></div>
        </section>
        <section class="issue-grid">
          ${graph.diagnostics.map(diag => issueCardHtml(diag)).join("") || `<div class="empty">気になる点は見つかっていません。</div>`}
        </section>
      `;
    }

    function skillsHtml() {
      const categories = allCategories();
      const skills = visibleSkills();
      return `
        <h2 class="section-title">スキルを探す</h2>
        <div class="filter-row">
          <input id="localSkillSearch" class="filter-input" type="search" value="${escapeHtml(state.localSkillSearch)}" placeholder="検索: DDD, review, repository...">
          <div class="tools" aria-label="カテゴリ">
            ${categories.map(category => `
              <button class="tab-button ${state.selectedCategory === category ? "active" : ""}" type="button" data-category="${escapeHtml(category)}">
                ${escapeHtml(categoryLabel(category))}
              </button>
            `).join("")}
          </div>
        </div>
        <section class="skill-grid">
          ${skills.map(node => skillCardHtml(node)).join("") || `<div class="empty">条件に合うスキルがありません。</div>`}
        </section>
      `;
    }

    function mapPanelHtml(title, showRecommendations) {
      return `
        <section class="map-panel">
          <div class="panel-head">
            <h2>${escapeHtml(title)}</h2>
            <div class="tools" aria-label="地図の操作">
              <div class="legend">
                <span class="legend-item"><span class="line-sample"></span>直接書かれている関係</span>
                <span class="legend-item"><span class="line-sample ai"></span>AI が読み取った関係</span>
              </div>
              <button id="zoomOut" class="tool-button" type="button" title="縮小">-</button>
              <button id="zoomIn" class="tool-button" type="button" title="拡大">+</button>
              <button id="fitMap" class="text-button" type="button">全体表示</button>
            </div>
          </div>
          <div class="map-stage">
            <svg id="skillMap" role="img" aria-label="スキルのつながり"></svg>
            <div class="map-empty" id="mapEmpty" hidden>表示できるスキルがありません。</div>
          </div>
        </section>
      `;
    }

    function relationCardHtml(edge) {
      return `
        <button class="skill-card ${state.selected?.kind === "relation" && state.selected.value.id === edge.id ? "selected" : ""}" type="button" data-relation-id="${escapeHtml(edge.id)}">
          <strong>${escapeHtml(skillName(edge.source))} → ${escapeHtml(skillName(edge.target))}</strong>
          <span>${escapeHtml(relationSourceText(edge))}</span>
          <span class="pill-row">
            <span class="pill ${isAiRelation(edge) ? "ai" : "direct"}">${escapeHtml(relationKindLabel(edge))}</span>
            <span class="pill">${escapeHtml(relationTypeText(edge))}</span>
          </span>
        </button>
      `;
    }

    function skillCardHtml(node) {
      const relationCount = relationsForSkill(node.id).length;
      const issueCount = issuesForSkill(node).length;
      return `
        <button class="skill-card ${state.selected?.kind === "skill" && state.selected.value.id === node.id ? "selected" : ""}" type="button" data-skill-id="${escapeHtml(node.id)}">
          <strong>${escapeHtml(skillName(node.id))}</strong>
          <span>${escapeHtml(skillSummary(node))}</span>
          <span class="pill-row">
            <span class="pill">${escapeHtml(categoryLabel(categoryFor(node)))}</span>
            <span class="pill direct">関係: ${relationCount} 件</span>
            <span class="pill ${issueCount ? "issue" : ""}">気になる点: ${issueCount} 件</span>
          </span>
        </button>
      `;
    }

    function issueCardHtml(diag) {
      const copy = issueCopy[diag.type] || issueCopy.invalid_agent_annotation;
      return `
        <button class="issue-card ${state.selected?.kind === "issue" && state.selected.value === diag ? "selected" : ""}" type="button" data-issue-key="${escapeHtml(issueKey(diag))}">
          <strong>${escapeHtml(copy.title)}</strong>
          <span>${escapeHtml(copy.what)}</span>
          <span class="pill-row">
            <span class="pill issue">確認が必要</span>
            ${diag.path ? `<span class="pill">${escapeHtml(diag.path)}</span>` : ""}
            ${diag.skill ? `<span class="pill">${escapeHtml(skillName(diag.skill))}</span>` : ""}
          </span>
        </button>
      `;
    }

    function issueKey(diag) {
      return [diag.type, diag.path, diag.skill, diag.target, diag.message].filter(Boolean).join("|");
    }

    function bindMainActions(root) {
      for (const button of root.querySelectorAll("[data-skill-id]")) {
        button.addEventListener("click", () => {
          const node = nodeIndex.get(button.dataset.skillId);
          if (node) setSelection("skill", node);
        });
      }
      for (const button of root.querySelectorAll("[data-relation-id]")) {
        button.addEventListener("click", () => {
          const edge = edgeIndex.get(button.dataset.relationId);
          if (edge) setSelection("relation", edge);
        });
      }
      for (const button of root.querySelectorAll("[data-issue-key]")) {
        button.addEventListener("click", () => {
          const diag = graph.diagnostics.find(item => issueKey(item) === button.dataset.issueKey);
          if (diag) setSelection("issue", diag);
        });
      }
      for (const button of root.querySelectorAll("[data-category]")) {
        button.addEventListener("click", () => {
          state.selectedCategory = button.dataset.category || "すべて";
          render();
        });
      }
      const localSearch = root.querySelector("#localSkillSearch");
      if (localSearch) {
        localSearch.addEventListener("input", event => {
          state.localSkillSearch = event.target.value;
          render();
        });
      }
      const direct = root.querySelector("#mainDirectRelations");
      if (direct) direct.addEventListener("change", event => {
        state.showDirectRelations = event.target.checked;
        render();
      });
      const ai = root.querySelector("#mainAiRelations");
      if (ai) ai.addEventListener("change", event => {
        state.showAiRelations = event.target.checked;
        render();
      });
      const zoomIn = root.querySelector("#zoomIn");
      const zoomOut = root.querySelector("#zoomOut");
      const fitMap = root.querySelector("#fitMap");
      if (zoomIn) zoomIn.addEventListener("click", () => zoomMap(1.15));
      if (zoomOut) zoomOut.addEventListener("click", () => zoomMap(1 / 1.15));
      if (fitMap) fitMap.addEventListener("click", () => {
        state.pendingFit = true;
        render();
      });
      for (const button of root.querySelectorAll("[data-recommend]")) {
        button.addEventListener("click", () => applyRecommendation(button.dataset.recommend));
      }
    }

    function applyRecommendation(value) {
      if (value === "issues") {
        setPage("issues");
        return;
      }
      if (value === "groups") {
        state.showGroupFrames = true;
        setPage("relations");
        return;
      }
      const entry = graph.nodes.find(node => Array.isArray(node.annotation?.roleTags) && node.annotation.roleTags.includes("entry")) || graph.nodes[0];
      if (entry) {
        state.activePage = "skills";
        setSelection("skill", entry);
      }
    }

    function renderDetails() {
      const panel = document.getElementById("detailPanel");
      if (!state.selected) {
        panel.innerHTML = overallDetailsHtml();
      } else if (state.selected.kind === "skill") {
        panel.innerHTML = skillDetailsHtml(state.selected.value);
      } else if (state.selected.kind === "relation") {
        panel.innerHTML = relationDetailsHtml(state.selected.value);
      } else {
        panel.innerHTML = issueDetailsHtml(state.selected.value);
      }
      bindDetailActions(panel);
    }

    function overallDetailsHtml() {
      return `
        <h2 class="section-title">全体について</h2>
        <section class="detail-card">
          <p class="muted">このビューアでは、リポジトリ内の SKILL.md と、スキル同士のつながり、確認が必要な項目を確認できます。</p>
          <div class="detail-section">
            <h3>見ておくとよい順番</h3>
            <div class="relation-list">
              <button class="relation-row" type="button" data-detail-page="overview"><strong>全体を把握する</strong><span>件数と地図から全体像を見る</span></button>
              <button class="relation-row" type="button" data-detail-page="relations"><strong>つながりを確認する</strong><span>直接の参照と AI の読み取りを見分ける</span></button>
              <button class="relation-row" type="button" data-detail-page="issues"><strong>気になる点を確認する</strong><span>修正候補を確認する</span></button>
            </div>
          </div>
        </section>
      `;
    }

    function skillDetailsHtml(node) {
      const incoming = graph.edges.filter(edge => edge.target === node.id);
      const outgoing = graph.edges.filter(edge => edge.source === node.id);
      const issues = issuesForSkill(node);
      return `
        <h2 class="section-title">選択中のスキル</h2>
        <section class="detail-card">
          <div class="detail-header">
            <span class="detail-icon">S</span>
            <div>
              <h2>${escapeHtml(skillName(node.id))}</h2>
              <p>${escapeHtml(skillSummary(node))}</p>
            </div>
          </div>
          <div class="file-row">${escapeHtml(skillPath(node))}</div>
          <div class="tabs" aria-label="詳細タブ">
            <button class="active" type="button">概要</button>
            <button type="button">関係</button>
            <button type="button">補足情報</button>
          </div>
          <div class="detail-section">
            <h3>このスキルについて</h3>
            <p class="muted">${escapeHtml(skillSummary(node))}</p>
          </div>
          <div class="detail-section">
            <h3>関係しているスキル</h3>
            ${renderRelationList("参考にしている（入ってくる）", incoming, "source")}
            ${renderRelationList("関連している（出ていく）", outgoing, "target")}
          </div>
          <div class="detail-section">
            <h3>気になる点</h3>
            ${issues.length ? `<ul>${issues.map(issue => `<li>${escapeHtml(issueLabel(issue.type))}</li>`).join("")}</ul>` : `<p class="muted">このスキルに紐づく項目はありません。</p>`}
          </div>
          <button class="text-button primary" type="button" data-open-skill="${escapeHtml(skillPath(node))}">このスキルを開く</button>
          ${devDetails({ id: node.id, path: skillPath(node), category: categoryFor(node), aliases: node.aliases || [] })}
        </section>
      `;
    }

    function renderRelationList(title, relations, otherKey) {
      if (!relations.length) {
        return `
          <div class="detail-section">
            <h3>${escapeHtml(title)}</h3>
            <p class="muted">該当するつながりはありません。</p>
          </div>
        `;
      }
      return `
        <div class="detail-section">
          <h3>${escapeHtml(title)}</h3>
          <div class="relation-list">
            ${relations.map(edge => `
              <button class="relation-row" type="button" data-relation-id="${escapeHtml(edge.id)}">
                <strong>${escapeHtml(skillName(edge[otherKey]))}</strong>
                <span>${escapeHtml(relationKindLabel(edge))}</span>
              </button>
            `).join("")}
          </div>
        </div>
      `;
    }

    function relationDetailsHtml(edge) {
      const evidence = relationSourceItems(edge);
      return `
        <h2 class="section-title">つながりの詳細</h2>
        <section class="detail-card">
          <p><strong>${escapeHtml(skillName(edge.source))}</strong><br>→ ${escapeHtml(skillName(edge.target))}</p>
          <div class="detail-section">
            <h3>関係の種類</h3>
            <p class="muted">${escapeHtml(relationKindLabel(edge))}</p>
          </div>
          <div class="detail-section">
            <h3>なぜ表示されているか</h3>
            <p class="muted">${escapeHtml(relationSourceText(edge))}</p>
          </div>
          <div class="detail-section">
            <h3>根拠</h3>
            ${evidence.length ? `<div class="relation-list">${evidence.map(item => `<div class="relation-row"><strong>${escapeHtml(evidenceText(item) || "根拠")}</strong></div>`).join("")}</div>` : `<p class="muted">根拠は追加されていません。</p>`}
          </div>
          ${isAiRelation(edge) ? `<div class="detail-section"><h3>注意</h3><p class="muted">これは SKILL.md に直接リンクが書かれている関係ではありません。AI が本文から読み取った補足情報です。</p></div>` : ""}
          ${devDetails({ id: edge.id, type: edge.type, origin: edge.origin, inferred: Boolean(edge.inferred) })}
        </section>
      `;
    }

    function issueDetailsHtml(diag) {
      const copy = issueCopy[diag.type] || issueCopy.invalid_agent_annotation;
      const evidence = diag.evidence || {};
      const evidenceLines = issueSourceLines(diag);
      return `
        <h2 class="section-title">気になる点の詳細</h2>
        <section class="detail-card">
          <div class="detail-header">
            <span class="detail-icon" style="background:var(--red);">!</span>
            <div>
              <h2>${escapeHtml(copy.title)}</h2>
              <p>${escapeHtml(diag.path || diag.skill || diag.target || "")}</p>
            </div>
          </div>
          <div class="issue-body">
            <section>
              <h4>何が起きているか</h4>
              <p>${escapeHtml(copy.what)}</p>
            </section>
            <section>
              <h4>なぜ困るか</h4>
              <p>${escapeHtml(copy.why)}</p>
            </section>
            <section>
              <h4>根拠</h4>
              ${evidenceLines.length ? `<ul>${evidenceLines.map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>` : `<p>追加の根拠はありません。</p>`}
            </section>
            <section>
              <h4>次にすること</h4>
              <ul>${issueActionList(diag)}</ul>
            </section>
          </div>
          ${devDetails({ internalName: diag.type, message: diag.message, evidence })}
        </section>
      `;
    }

    function issueSourceLines(diag) {
      const lines = [];
      if (diag.path) lines.push(diag.path);
      if (diag.skill) lines.push(`対象のスキル: ${skillName(diag.skill)}`);
      if (diag.target) lines.push(`参照している先: ${diag.target}`);
      const evidence = diag.evidence;
      if (evidence && typeof evidence === "object") {
        if (evidence.path || evidence.text || evidence.raw) lines.push(evidenceText(evidence));
        if (Array.isArray(evidence.skills)) lines.push(`該当するスキル: ${evidence.skills.map(skillName).join(", ")}`);
        if (Array.isArray(evidence.aliases)) {
          for (const item of evidence.aliases) {
            lines.push(`${skillName(item.skill)} / ${item.path || ""} / ${item.source || ""}`);
          }
        }
        if (Array.isArray(evidence.copies)) {
          for (const item of evidence.copies) {
            lines.push(`${item.host || "unknown"}: ${item.path || ""}`);
          }
        }
      }
      return lines.filter(Boolean);
    }

    function devDetails(value) {
      return `
        <details class="dev">
          <summary>開発者向け情報</summary>
          <pre>${escapeHtml(JSON.stringify(value, null, 2))}</pre>
        </details>
      `;
    }

    function bindDetailActions(root) {
      for (const button of root.querySelectorAll("[data-relation-id]")) {
        button.addEventListener("click", () => {
          const edge = edgeIndex.get(button.dataset.relationId);
          if (edge) setSelection("relation", edge);
        });
      }
      for (const button of root.querySelectorAll("[data-detail-page]")) {
        button.addEventListener("click", () => setPage(button.dataset.detailPage));
      }
      for (const button of root.querySelectorAll("[data-open-skill]")) {
        button.addEventListener("click", () => {
          const path = button.dataset.openSkill || "";
          if (!path || !graph.root) return;
          const url = `file://${String(graph.root).replace(/\/$/, "")}/${path}`;
          window.open(url, "_blank", "noopener");
        });
      }
    }

    function mapNodes() {
      const relatedIds = new Set();
      const relations = visibleRelations();
      for (const edge of relations) {
        relatedIds.add(edge.source);
        relatedIds.add(edge.target);
      }
      const searched = visibleSkills();
      if (state.searchQuery.trim()) {
        return searched.filter(node => relatedIds.has(node.id) || relations.length === 0);
      }
      return graph.nodes;
    }

    function drawMap(svg) {
      const width = Math.max(360, svg.clientWidth || svg.parentElement.clientWidth || 720);
      const height = Math.max(320, svg.clientHeight || svg.parentElement.clientHeight || 420);
      const nodes = mapNodes();
      const nodeIds = new Set(nodes.map(node => node.id));
      const relations = visibleRelations().filter(edge => nodeIds.has(edge.source) && nodeIds.has(edge.target));
      document.getElementById("mapEmpty").hidden = nodes.length > 0;
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.innerHTML = `
        <defs>
          <marker id="arrowDirect" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2368d8"></path></marker>
          <marker id="arrowAi" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7b4ce2"></path></marker>
          <marker id="arrowSelected" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#d92d3a"></path></marker>
        </defs>
      `;
      if (!nodes.length) return;
      const bounds = layoutBounds(nodes, width, height);
      if (state.pendingFit) {
        const scale = Math.min(1, width / Math.max(1, bounds.width), height / Math.max(1, bounds.height));
        state.view = {
          x: (width - bounds.width * scale) / 2,
          y: (height - bounds.height * scale) / 2,
          scale,
        };
        state.pendingFit = false;
      }
      const layer = svgElement("g", { transform: `translate(${state.view.x} ${state.view.y}) scale(${state.view.scale})` });
      svg.append(layer);
      const positions = layoutPositions(nodes, bounds);
      if (state.showGroupFrames) drawGroupFrames(layer, nodes, positions);
      const occurrence = new Map();
      for (const edge of relations) {
        const source = positions.get(edge.source);
        const target = positions.get(edge.target);
        if (!source || !target) continue;
        const key = `${edge.source}->${edge.target}`;
        const index = occurrence.get(key) || 0;
        occurrence.set(key, index + 1);
        drawRelation(layer, edge, source, target, index);
      }
      for (const node of nodes) {
        const point = positions.get(node.id);
        if (point) drawSkill(layer, node, point);
      }
      svg.onwheel = event => {
        event.preventDefault();
        zoomMap(event.deltaY < 0 ? 1.12 : 1 / 1.12);
      };
      svg.onclick = event => {
        if (event.target === svg) clearSelection();
      };
    }

    function layoutBounds(nodes, width, height) {
      const count = Math.max(1, nodes.length);
      const aspect = Math.max(.8, Math.min(2.6, width / Math.max(1, height)));
      const columns = Math.max(1, Math.ceil(Math.sqrt(count * aspect)));
      const rows = Math.max(1, Math.ceil(count / columns));
      return {
        width: Math.max(width, columns * (MAP_NODE_WIDTH + 20) + 96),
        height: Math.max(height, rows * (MAP_NODE_HEIGHT + 58) + 96),
        columns,
        rows,
      };
    }

    function layoutPositions(nodes, bounds) {
      const width = bounds.width;
      const height = bounds.height;
      const columns = Math.max(1, bounds.columns || 1);
      const rows = Math.max(1, bounds.rows || 1);
      const paddingX = MAP_NODE_WIDTH / 2 + 24;
      const paddingY = MAP_NODE_HEIGHT / 2 + 32;
      const usableWidth = Math.max(1, width - paddingX * 2);
      const usableHeight = Math.max(1, height - paddingY * 2);
      const positions = new Map();
      const sortedNodes = [...nodes].sort((a, b) => {
        const categoryCompare = String(categoryFor(a)).localeCompare(String(categoryFor(b)), "ja");
        if (categoryCompare) return categoryCompare;
        return skillName(a.id).localeCompare(skillName(b.id), "ja");
      });
      sortedNodes.forEach((node, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);
        const x = columns === 1 ? width / 2 : paddingX + (col / (columns - 1)) * usableWidth;
        const y = rows === 1 ? height / 2 : paddingY + (row / (rows - 1)) * usableHeight;
        positions.set(node.id, { x, y, category: categoryFor(node) });
      });
      return positions;
    }

    function drawGroupFrames(layer, nodes, positions) {
      const groups = new Map();
      for (const node of nodes) {
        const point = positions.get(node.id);
        if (!point) continue;
        const key = categoryFor(node);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(point);
      }
      for (const [category, points] of groups) {
        const xs = points.map(point => point.x);
        const ys = points.map(point => point.y);
        const x = Math.min(...xs) - MAP_NODE_WIDTH / 2 - 18;
        const y = Math.min(...ys) - MAP_NODE_HEIGHT / 2 - 28;
        const w = Math.max(...xs) - Math.min(...xs) + MAP_NODE_WIDTH + 36;
        const h = Math.max(...ys) - Math.min(...ys) + MAP_NODE_HEIGHT + 56;
        layer.append(svgElement("rect", { class: "category-frame", x, y, width: w, height: h, rx: 8 }));
        const label = svgElement("text", { class: "category-label", x: x + 12, y: y + 23 });
        label.textContent = categoryLabel(category);
        layer.append(label);
      }
    }

    function drawRelation(layer, edge, source, target, index) {
      const dx = target.x - source.x;
      const dy = target.y - source.y;
      const distance = Math.max(1, Math.hypot(dx, dy));
      const offset = ((index % 5) - 2) * 16;
      const sx = source.x + (dx / distance) * (MAP_NODE_WIDTH / 2 - 4);
      const sy = source.y + (dy / distance) * (MAP_NODE_HEIGHT / 2 - 2);
      const tx = target.x - (dx / distance) * (MAP_NODE_WIDTH / 2 - 4);
      const ty = target.y - (dy / distance) * (MAP_NODE_HEIGHT / 2 - 2);
      const mx = (sx + tx) / 2 - (dy / distance) * offset;
      const my = (sy + ty) / 2 + (dx / distance) * offset;
      const d = `M ${sx} ${sy} Q ${mx} ${my} ${tx} ${ty}`;
      const selected = state.selected?.kind === "relation" && state.selected.value.id === edge.id;
      const hit = svgElement("path", { class: "relation-hit", d });
      hit.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("relation", edge);
      });
      const path = svgElement("path", {
        class: `relation-path ${isAiRelation(edge) ? "ai" : ""} ${selected ? "selected" : ""}`,
        d,
        "marker-end": selected ? "url(#arrowSelected)" : isAiRelation(edge) ? "url(#arrowAi)" : "url(#arrowDirect)",
      });
      path.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("relation", edge);
      });
      layer.append(hit, path);
    }

    function drawSkill(layer, node, point) {
      const selected = state.selected?.kind === "skill" && state.selected.value.id === node.id;
      const hasAi = relationsForSkill(node.id).some(isAiRelation);
      const group = svgElement("g", {
        class: `skill-node ${hasAi ? "ai" : ""} ${selected ? "selected" : ""}`,
        transform: `translate(${point.x - MAP_NODE_WIDTH / 2} ${point.y - MAP_NODE_HEIGHT / 2})`,
      });
      group.addEventListener("click", event => {
        event.stopPropagation();
        setSelection("skill", node);
      });
      group.append(svgElement("rect", { width: MAP_NODE_WIDTH, height: MAP_NODE_HEIGHT, rx: 8 }));
      const label = svgElement("text", { x: MAP_NODE_WIDTH / 2, y: MAP_NODE_HEIGHT / 2 + 4, "text-anchor": "middle" });
      label.textContent = compactText(skillName(node.id), 20);
      group.append(label);
      layer.append(group);
    }

    function svgElement(name, attrs) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs || {})) {
        element.setAttribute(key, String(value));
      }
      return element;
    }

    function zoomMap(factor) {
      state.view.scale = Math.max(.28, Math.min(2.6, state.view.scale * factor));
      const map = document.getElementById("skillMap");
      if (map) drawMap(map);
    }

    document.getElementById("globalSearch").addEventListener("input", event => {
      state.searchQuery = event.target.value;
      state.pendingFit = true;
      render();
    });
    document.getElementById("showDirectRelations").addEventListener("change", event => {
      state.showDirectRelations = event.target.checked;
      render();
    });
    document.getElementById("showAiRelations").addEventListener("change", event => {
      state.showAiRelations = event.target.checked;
      render();
    });
    document.getElementById("showGroupFrames").addEventListener("change", event => {
      state.showGroupFrames = event.target.checked;
      render();
    });
    window.addEventListener("resize", () => {
      state.pendingFit = true;
      render();
    });

    render();
  </script>
</body>
</html>
